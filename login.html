<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVHOST // License Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: rgba(18, 22, 33, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #00f2fe;
            --accent-2: #4facfe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(79, 172, 254, 0.12), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.10), transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(79, 172, 254, 0.08);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(79, 172, 254, 0.1);
            border: 1px solid rgba(79, 172, 254, 0.25);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .brand-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background: rgba(9, 11, 16, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px 44px 14px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
        }

        .paste-btn {
            position: absolute;
            right: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .paste-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            color: #05080f;
            font-weight: 700;
            font-size: 14.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .btn-primary:disabled {
            background: #2a303c;
            color: #6b7280;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #statusBox {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            display: none;
            line-height: 1.4;
        }

        .error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .warning { background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fcd34d; }
        .info { background: rgba(79, 172, 254, 0.12); border: 1px solid rgba(79, 172, 254, 0.3); color: #93c5fd; }

        /* HOME DASHBOARD STYLES */
        #homePage { display: none; }

        .profile-card {
            background: rgba(9, 11, 16, 0.65);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-info h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hwid-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .hwid-tag:hover { color: var(--accent); }

        .status-pill {
            text-align: right;
        }

        .badge-active {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #34d399;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 4px;
        }

        .expiry-text {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .video-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
            margin-bottom: 20px;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
        }

        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 11, 16, 0.65);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .resource-item:hover {
            border-color: var(--accent-2);
            background: rgba(79, 172, 254, 0.08);
        }

        .btn-logout {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fecaca;
        }
    </style>
</head>
<body>
<div class="container">
        <!-- LOGIN PAGE -->
        <div id="loginPage">
            <div class="brand-header">
                <div class="brand-badge">
                    <span class="dot"></span> SYSTEM ONLINE
                </div>
                <h1>License Authentication</h1>
                <p class="subtitle">Ilagay ang iyong registered Hardware ID (HWID) upang ma-access ang dashboard.</p>
            </div>

            <div class="input-group">
                <label for="hwidInput">Hardware ID</label>
                <div class="input-wrapper">
                    <input type="text" id="hwidInput" placeholder="Enter your HWID...">
                    <button type="button" id="pasteBtn" class="paste-btn">PASTE</button>
                </div>
            </div>

            <button type="button" id="submitBtn" class="btn-primary">Verify & Login</button>
            <div id="statusBox"></div>
        </div>

        <!-- HOME DASHBOARD PAGE -->
        <div id="homePage">
            <div class="profile-card">
                <div class="user-info">
                    <h2 id="displayClientName">User</h2>
                    <div class="hwid-tag" id="copyHwidBtn">
                        <span>HWID: <span id="displayHwid">---</span></span>
                        <span id="copyFeedback">[Copy]</span>
                    </div>
                </div>
                <div class="status-pill">
                    <span class="badge-active" id="statusBadge">ACTIVE</span>
                    <span class="expiry-text" id="displayExpiry">N/A</span>
                </div>
            </div>

            <div class="section-title">
                <span>Live Showcase Preview</span>
                <span style="color: var(--success);">● AUTO-PLAY</span>
            </div>
            <div class="video-wrapper">
                <!-- Added autoplay and muted for guaranteed browser auto-play -->
                <video id="previewVideo" autoplay muted loop playsinline preload="auto"></video>
            </div>

            <div class="section-title">
                <span>Quick Resources</span>
            </div>
            <div class="resource-list">
                <!-- Added missing IDs and target="_blank" so links open properly -->
                <a href="#" id="showcaseLinkBtn" target="_blank" class="resource-item">
                    <span>🎬 Watch Full Showcase Video</span>
                    <span>→</span>
                </a>
                <a href="#" id="downloadLoaderBtn" target="_blank" class="resource-item">
                    <span>⚡ Download Latest Loader</span>
                    <span>→</span>
                </a>
                <a href="#" id="supportLinkBtn" target="_blank" class="resource-item">
                    <span>💬 Contact Admin Support</span>
                    <span>→</span>
                </a>
            </div>

            <button type="button" id="logoutBtn" class="btn-logout">Disconnect / Logout</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION LINKS (EDIT YOUR URLS HERE)
        // ==========================================
        const GITHUB_URL = "https://raw.githubusercontent.com/mrchupol/sevhost.github.io/refs/heads/main/Ctool.txt";
        const CATBOX_VIDEO_URL = "https://www.facebook.com/share/v/1E5Guk5RR8/"; // Must end in .mp4
        const FULL_SHOWCASE_URL = "https://www.facebook.com/share/v/1E5Guk5RR8/";
        const LOADER_DOWNLOAD_URL = "https://dl.dropbox.com/scl/fi/f3u004rhhfaxome8gnh3e/10-14-26.exe?rlkey=19qgoo2w0ii679kpq9mg00rm2&st=pb67m81i&dl=0";
        const ADMIN_SUPPORT_URL = "https://discord.gg/Hs3vYavRW";
        // ==========================================

        document.getElementById('showcaseLinkBtn').href = FULL_SHOWCASE_URL;
        document.getElementById('downloadLoaderBtn').href = LOADER_DOWNLOAD_URL;
        document.getElementById('supportLinkBtn').href = ADMIN_SUPPORT_URL;

        const video = document.getElementById('previewVideo');
        video.muted = true;
        video.defaultMuted = true;
        video.src = CATBOX_VIDEO_URL;

        function showStatus(type, message) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = type;
            statusBox.textContent = message;
            statusBox.style.display = 'block';
        }

        function openHomePage(hwid, clientName, expiryDateStr) {
            localStorage.setItem('saved_hwid', hwid);
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('displayClientName').textContent = clientName;
            document.getElementById('displayHwid').textContent = hwid;
            document.getElementById('displayExpiry').textContent = expiryDateStr;

            const badge = document.getElementById('statusBadge');
            if (expiryDateStr.toLowerCase().includes("no expired") ||
                expiryDateStr.toLowerCase().includes("lifetime")) {
                badge.textContent = "VIP // LIFETIME";
            } else {
                badge.textContent = "ACTIVE LICENSE";
            }

            video.muted = true;
            video.currentTime = 0;
            video.play().catch(() => {});
        }

        function logout() {
            localStorage.removeItem('saved_hwid');
            video.pause();
            video.currentTime = 0;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('hwidInput').value = '';
            document.getElementById('statusBox').style.display = 'none';
        }
        function getMonthNumber(dateStr) {
            const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
            const lower = dateStr.toLowerCase();
            for (let i = 0; i < months.length; i++) {
                if (lower.indexOf(months[i]) !== -1) return i + 1;
            }
            return 0;
        }

        function getDayNumber(dateStr) {
            const match = dateStr.match(/\b(\d{1,2})\b/);
            if (match && match.length > 1) {
                return parseInt(match, 10);
            }
            return 0;
        }

        function isExpired(expiryDateStr) {
            const lower = expiryDateStr.toLowerCase();
            if (lower.includes("no expired") || lower.includes("lifetime")) {
                return false;
            }
            const expMonth = getMonthNumber(expiryDateStr);
            const expDay = getDayNumber(expiryDateStr);
            if (expMonth === 0 || expDay === 0) return false;
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentDay = now.getDate();
            if (expMonth < currentMonth) return true;
            if (expMonth === currentMonth && expDay < currentDay) return true;
            return false;
        }

        async function fetchHWIDList() {
            try {
                const res = await fetch(GITHUB_URL + "?t=" + Date.now());
                if (res.ok) return await res.text();
            } catch (e) {}
            try {
                const proxy1 = "https://allorigins.win" + encodeURIComponent(GITHUB_URL);
                const res1 = await fetch(proxy1);
                if (res1.ok) return await res1.text();
            } catch (e) {}
            const proxy2 = "https://corsproxy.io?" + encodeURIComponent(GITHUB_URL);
            const res2 = await fetch(proxy2);
            if (!res2.ok) throw new Error("Hindi ma-access ang authentication server.");
            return await res2.text();
        }

        async function verifyHWID(autoHwid = null) {
            video.muted = true;
            video.play().then(() => video.pause()).catch(() => {});
            const inputEl = document.getElementById('hwidInput');
            const currentHWID = (autoHwid || inputEl.value).replace(/\s+/g, '');
            const btn = document.getElementById('submitBtn');
            if (!currentHWID) {
                showStatus('error', "[ERROR] Pakilagay muna ang iyong Hardware ID.");
                return;
            }
            btn.disabled = true;
            btn.textContent = "Authenticating...";
            showStatus('info', "[SYSTEM] Kumokonekta sa database, pakihintay...");
            try {
                const onlineData = await fetchHWIDList();
                let hwidMatched = false;
                let clientName = "Unknown User";
                let expiryDateStr = "No Date Found";
                const lines = onlineData.split(/\r?\n/);
                for (let i = 0; i < lines.length; i++) {
                    const cleanLine = lines[i].replace(/\s+/g, '');
                    if (cleanLine === currentHWID) {
                        hwidMatched = true;
                        for (let j = i + 1; j < lines.length; j++) {
                            const subLine = lines[j];
                            if (subLine.indexOf("name") !== -1) {
                                const idx = subLine.indexOf(":") + 1;
                                const val = subLine.substring(idx).replace(/['",;]/g, '').trim();
                                if (val) clientName = val;
                            }
                            if (subLine.indexOf("date") !== -1) {
                                const idx = subLine.indexOf(":") + 1;
                                const val = subLine.substring(idx).replace(/['",;]/g, '').trim();
                                if (val) expiryDateStr = val;
                            }
                            if (subLine.indexOf("};") !== -1) break;
                        }
                        break;
                    }
                }
                if (!hwidMatched) {
                    localStorage.removeItem('saved_hwid');
                    showStatus('error', "[ACCESS DENIED] Hindi naka-register ang HWID na ito.");
                } else if (isExpired(expiryDateStr)) {
                    localStorage.removeItem('saved_hwid');
                    showStatus('warning', `[EXPIRED] Tapos na ang iyong subscription (${expiryDateStr}). Magmessage sa admin upang mag-renew.`);
                } else {
                    openHomePage(currentHWID, clientName, expiryDateStr);
                }
            } catch (err) {
                showStatus('error', "[CONNECTION ERROR] " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Verify & Login";
            }
        }

        // Paste Button
        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('hwidInput').value = text.trim();
} catch (err) {
showStatus('warning', "[INFO] I-paste nang manual gamit ang Ctrl+V.");
}
});
// Copy HWID sa Dashboard
document.getElementById('copyHwidBtn').addEventListener('click', () => {
const hwid = document.getElementById('displayHwid').textContent;
navigator.clipboard.writeText(hwid);
const fb = document.getElementById('copyFeedback');
fb.textContent = "[Copied!]";
fb.style.color = "#34d399";
setTimeout(() => {
fb.textContent = "[Copy]";
fb.style.color = "";
}, 1500);
});
document.getElementById('submitBtn').addEventListener('click', () => verifyHWID());
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('hwidInput').addEventListener('keypress', (e) => {
if (e.key === 'Enter') verifyHWID();
});
// Auto-login kapag may naka-save na valid HWID sa browser
window.addEventListener('DOMContentLoaded', () => {
const saved = localStorage.getItem('saved_hwid');
if (saved) {
document.getElementById('hwidInput').value = saved;
verifyHWID(saved);
}
});
        document.getElementById('submitBtn').addEventListener('click', verifyHWID);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('hwidInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyHWID();
        });
    </script>
</body>
</html>
